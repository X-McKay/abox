[workspace]
members = [
    "crates/abox-cli",
    "crates/abox-core",
    "crates/abox-protocol",
    "crates/abox-proxyd",
    "crates/abox-shim",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/X-McKay/abox"
# No MSRV is promised. abox is an application (not a published library) and
# tracks the latest stable Rust — see rust-toolchain.toml (`channel = "stable"`)
# and CI (`dtolnay/rust-toolchain@stable`). The clippy `-D warnings` gate runs
# on stable, so the effective floor is "current stable"; deliberately omitting
# `rust-version` rather than declaring a value nothing verifies.

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

# ─── Workspace-wide lint policy ──────────────────────────────────────────────
# All crates inherit these via `[lints] workspace = true` in their Cargo.toml.

[workspace.lints.rust]
unsafe_code = "deny"
# Enable missing_docs once the API stabilizes.
# missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic overrides — these are too noisy for this project.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"
let_underscore_untyped = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"

# ─── Release profile ─────────────────────────────────────────────────────────

[profile.release]
lto = true
strip = true
codegen-units = 1
