[package]
name = "abox-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Guest-side static musl binary embedded into the rootfs image. Never
# consumed as a library and not published to crates.io.
publish = false

[[bin]]
name = "abox-shim"
path = "src/main.rs"

# Minimal dependencies for a static musl binary.
# No tokio, no async — synchronous only for smallest possible binary.
[dependencies]
abox-protocol = { path = "../abox-protocol" }
serde_json = "1"

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[lints]
workspace = true
