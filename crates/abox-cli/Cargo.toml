[package]
name = "abox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Distributed as the `abox` binary via GitHub releases (scripts/install.sh),
# not published to crates.io.
publish = false

[[bin]]
name = "abox"
path = "src/main.rs"

[dependencies]
abox-core = { path = "../abox-core" }
# Same exact pin as abox-core (ADR-008): used by `abox init`/`abox doctor`
# to install and verify the MicroSandbox runtime assets in $MSB_HOME.
microsandbox = { version = "=0.6.9", default-features = false, features = ["net", "prebuilt"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs.workspace = true
toml.workspace = true
toml_edit = "0.22"
sha2 = "0.10"
ratatui = "0.29"
crossterm = "0.28"

[lints]
workspace = true

[dev-dependencies]
abox-core = { path = "../abox-core", features = ["test-support"] }
tempfile = "3"
