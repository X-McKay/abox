[package]
name = "abox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Internal crate — not published to crates.io. Distribution happens via
# GitHub releases of the abox binary; this library is consumed only by
# siblings in this workspace.
publish = false

[dependencies]
abox-protocol = { path = "../abox-protocol" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex.workspace = true
chrono.workspace = true
dirs.workspace = true
globset.workspace = true
git2 = "0.21"
sha2 = "0.10"
getrandom = "0.2"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
reqwest = { version = "0.12", features = ["json"] }
time = "0.3"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustix = { version = "1", features = ["fs"] }
# MicroSandbox runtime (ADR-008). Pinned exactly during the migration;
# updated only through dedicated dependency PRs qualified by the runtime
# contract + security suites. `prebuilt` installs the msb runtime +
# libkrunfw guest firmware into ~/.microsandbox (idempotent; also driven at
# runtime by `abox init`); `keyring` is deliberately off (no dbus — abox
# pulls public images anonymously).
microsandbox = { version = "=0.6.9", default-features = false, features = ["net", "prebuilt"] }
# Direct access to the network policy types (Destination, DomainName, …) the
# facade does not re-export. Same exact pin as `microsandbox`.
microsandbox-network = "=0.6.9"

[features]
# Exposes `runtime::testing::MockRuntime` for downstream test suites.
test-support = []

[lints]
workspace = true

[dev-dependencies]
abox-core = { path = ".", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benchmarks"
harness = false
