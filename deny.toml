# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Run with: cargo deny check
# Install: cargo install cargo-deny
#
# Schema v2 (cargo-deny 0.18+). Migration notes:
# - `vulnerability` and `notice` are implicit in v2 (always deny / always warn).
# - `unmaintained` is now a scope, not a severity ("workspace" = only check
#   crates in our workspace, not every transitive dep of a transitive dep).
# - `unlicensed` and `copyleft` are implicit in v2 — anything not in the
#   `allow` list fails.

[advisories]
version = 2
# Only flag unmaintained crates reachable from our workspace.
unmaintained = "workspace"
# Warn (not fail) on yanked crates so a yank upstream doesn't break CI mid-flight.
yanked = "warn"
[licenses]
version = 2
# Allow only these license families. Anything else causes the check to fail.
#
# MPL-2.0 (added for the `option-ext` transitive of `dirs`): MPL-2.0 is
# file-level weak copyleft. Linking an MPL-2.0 library into a non-MPL binary
# is permitted; the obligations apply only to modifications of MPL-2.0 files.
# This is the common industry position.
#
# CDLA-Permissive-2.0 (added for the `webpki-roots` crates used by rustls):
# the Linux Foundation's permissive data license. Functionally equivalent
# in effect to MIT/Apache-2.0 for the purposes of a compiled binary.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  # Public-domain-equivalent licenses pulled in by the MicroSandbox runtime's
  # userspace network stack (smoltcp/managed: 0BSD; notify: CC0-1.0). Both
  # are maximally permissive with no attribution requirement.
  "0BSD",
  "CC0-1.0",
]
# Require SPDX expressions to be at least 80% confident before accepting.
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same crate (pressure on dependency bloat).
multiple-versions = "warn"
# Never allow wildcard version requirements in external deps.
wildcards = "deny"
# But DO allow wildcards for workspace-internal path deps (e.g., abox-cli
# depending on `abox-core = { version = "*", path = "..." }`). This is the
# idiomatic pattern for unpublished intra-workspace crates.
allow-wildcard-paths = true

[sources]
# Only allow crates from crates.io, no random git deps.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
