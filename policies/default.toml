# Default abox credential proxy policy.
#
# This file controls which CLI commands and HTTP destinations are allowed
# from sandboxes. Deny rules are evaluated before allow rules.
#
# Place this file at ~/.abox/policies/default.toml or specify a custom
# path in config.toml.

# Default action for CLI commands not matching any policy: "allow" or "deny".
default_cli_action = "deny"

# Default action for HTTP requests not matching any egress rule: "deny".
default_egress_action = "deny"

# ── Git ──────────────────────────────────────────────────────────────────
[[cli]]
command = "git"
forward_ssh_agent = true

# Allowed git operations (regexes matched against the full argument string)
allow = [
    "^status",
    "^log",
    "^diff",
    "^show",
    "^branch",
    "^add\\s+",
    "^commit\\s+",
    "^checkout\\s+",
    "^switch\\s+",
    "^push\\s+origin\\s+\\S+$",
    "^pull\\s+",
    "^fetch\\s+",
    "^clone\\s+",
    "^stash",
    "^rebase\\s+",
    "^merge\\s+",
    "^rev-parse",
    "^remote\\s+-v",
]

# Denied git operations (checked first — deny takes precedence)
deny = [
    "--force",
    "-f\\b",
    "push\\s+--delete",
    "push\\s+origin\\s+:refs",
    "\\breset\\s+--hard",
    "\\bclean\\s+-fd",
]

# ── GitHub CLI ───────────────────────────────────────────────────────────
[[cli]]
command = "gh"
forward_ssh_agent = false

allow = [
    "^pr\\s+(create|list|view|checkout|diff|merge)",
    "^issue\\s+(create|list|view)",
    "^repo\\s+view",
    "^auth\\s+status",
]

deny = [
    "^repo\\s+delete",
    "^auth\\s+login",
]

# ── AWS CLI ──────────────────────────────────────────────────────────────
[[cli]]
command = "aws"
forward_ssh_agent = false

allow = [
    "^s3\\s+(ls|cp|sync|mv|rm)",
    "^sts\\s+get-caller-identity",
    "^logs\\s+(describe|get|filter)",
]

deny = [
    "^iam\\s+",
    "^ec2\\s+(run-instances|terminate)",
    "^organizations\\s+",
    "^sts\\s+assume-role",
]

# ── TLS Bypass List ─────────────────────────────────────────────────────
# Domains listed here use plain TCP passthrough (no TLS termination).
# Use this for cert-pinned clients that would reject the MITM CA cert.
# Supports exact match and wildcard prefix (e.g., "*.pinned.io").
bypass_tls = []

# ── HTTP Egress Rules ────────────────────────────────────────────────────
# Each rule matches a domain and injects a credential header.

[[egress]]
domain = "api.anthropic.com"
inject_header = "Authorization"
credential_file = "~/.claude/.credentials.json"
json_path = "claudeAiOauth.accessToken"
header_template = "Bearer {value}"

[[egress]]
domain = "api.openai.com"
inject_header = "Authorization"
env_var = "OPENAI_API_KEY"
credential_file = "~/.codex/auth.json"
json_path = "tokens.access_token"
header_template = "Bearer {value}"

# Codex Responses API — same credential as api.openai.com.
[[egress]]
domain = "chatgpt.com"
inject_header = "Authorization"
credential_file = "~/.codex/auth.json"
json_path = "tokens.access_token"
header_template = "Bearer {value}"

# Codex token refresh endpoint.
[[egress]]
domain = "auth.openai.com"
inject_header = "Authorization"
credential_file = "~/.codex/auth.json"
json_path = "tokens.access_token"
header_template = "Bearer {value}"

[[egress]]
domain = "*.googleapis.com"
inject_header = "Authorization"
env_var = "GOOGLE_API_KEY"
header_template = "Bearer {value}"

[[egress]]
domain = "api.github.com"
inject_header = "Authorization"
env_var = "GITHUB_TOKEN"
header_template = "Bearer {value}"
