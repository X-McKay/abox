# Cargo configuration for the abox workspace.

[alias]
# Shorthand aliases for common workflows.
c = "check --workspace"
t = "test --workspace"
l = "clippy --workspace --all-targets -- -D warnings"
b = "build --workspace"
r = "run -p abox-cli --"

[target.x86_64-unknown-linux-musl]
# Static linking for the guest binaries (abox-shim, abox-bridge).
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
# Static linking for the guest binaries (abox-shim, abox-bridge).
rustflags = ["-C", "target-feature=+crt-static"]
