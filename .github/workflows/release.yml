name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts without publishing a release (for smoke testing)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            arch: aarch64
          # macOS (Apple Silicon) host support arrives with the MicroSandbox
          # runtime (ADR-008): libkrun uses Hypervisor.framework.
          - target: aarch64-apple-darwin
            os: macos-14
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # libkrun's device layer (capng crate) links against libcap-ng on Linux.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcap-ng-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p abox-cli

      - uses: actions/upload-artifact@v7
        with:
          name: abox-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/abox

  # Static musl guest binaries (abox-shim + abox-bridge) staged by
  # `abox init` under ~/.abox/guest/<arch>/ so shim protocol stays in
  # lockstep with the released host binary (the OCI guest images bake
  # fallback copies). One tarball per guest architecture.
  guest-binaries:
    name: Guest binaries (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: guest-bins-${{ matrix.target }}

      - name: Build static guest binaries
        run: |
          RUSTFLAGS="-C linker=rust-lld -C link-self-contained=yes" \
            cargo build --release --target ${{ matrix.target }} -p abox-shim

      - name: Create guest binaries tarball
        run: |
          mkdir -p guest-bins
          cp target/${{ matrix.target }}/release/abox-shim \
             target/${{ matrix.target }}/release/abox-bridge guest-bins/
          tar czf abox-guest-bins-${{ matrix.arch }}.tar.gz -C guest-bins .

      - uses: actions/upload-artifact@v7
        with:
          name: abox-guest-bins-${{ matrix.arch }}
          path: abox-guest-bins-${{ matrix.arch }}.tar.gz

  release:
    name: Publish GitHub Release
    # Skip publishing on dry-run (workflow_dispatch with dry_run=true).
    if: ${{ !inputs.dry_run }}
    needs: [build, guest-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Arrange release files
        run: |
          mkdir -p release
          # Copy binaries — rename to include target
          for dir in artifacts/abox-*-unknown-linux-*gnu artifacts/abox-*-apple-darwin; do
            [ -d "$dir" ] || continue
            target="$(basename "$dir")"
            cp "$dir/abox" "release/$target"
            chmod +x "release/$target"
          done
          # Copy guest binary tarballs (staged by the installer / abox init)
          cp artifacts/abox-guest-bins-*/abox-guest-bins-*.tar.gz release/

      - name: Generate SHA256SUMS
        run: |
          cd release
          sha256sum * > SHA256SUMS

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract from "## [VERSION]" or "## vVERSION" to next "## " heading
          sed -n "/^## .*${VERSION}/,/^## /p" CHANGELOG.md | head -n -1 > RELEASE_NOTES.md
          # Fallback if extraction is empty
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi

      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release/*
