name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # Include label events so adding/removing `runtime-attested` re-runs the
    # attestation check. Without this, the check uses the original event's
    # label list and misses later label operations.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      # libkrun's device layer (capng crate) links against libcap-ng on Linux.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcap-ng-dev

      # The microsandbox crate's build script installs the msb runtime bundle
      # into ~/.microsandbox on first build; cache it so CI doesn't
      # re-download it every run.
      - name: Cache MicroSandbox runtime bundle
        uses: actions/cache@v4
        with:
          path: ~/.microsandbox
          key: msb-runtime-${{ runner.os }}-0.6.9

      - name: just check (fmt + clippy + test)
        run: just check

  cargo-deny:
    name: supply-chain audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check
        run: cargo deny check

  e2e-runtime:
    name: runtime e2e (live microVMs via KVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e-runtime

      # libkrun's device layer (capng crate) links against libcap-ng on Linux.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcap-ng-dev

      - name: Cache MicroSandbox runtime bundle
        uses: actions/cache@v4
        with:
          path: ~/.microsandbox
          key: msb-runtime-${{ runner.os }}-0.6.9

      - name: Run the live runtime e2e suite
        # GitHub-hosted Ubuntu runners expose /dev/kvm; the msb runtime
        # bundle is installed by the microsandbox crate's build script on
        # first build. The suite skips cleanly (exit 0 with a "skipped:"
        # message) if virtualization or runtime assets are unavailable.
        run: |
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ./scripts/local/msb_e2e_test.sh

  runtime-attestation:
    name: Runtime attestation (label required when runtime paths touched)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect runtime-touching paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            runtime:
              - 'images/**'
              - 'crates/abox-core/**'
              - 'crates/abox-proxyd/**'
              - 'crates/abox-protocol/**'
              - 'crates/abox-shim/**'
              - 'templates/config.example.toml'

      - name: Enforce runtime-attested label when runtime paths touched
        if: steps.filter.outputs.runtime == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (!labels.includes('runtime-attested')) {
              core.setFailed(
                'This PR touches runtime/guest/broker code. Run `just e2e-runtime` ' +
                'locally, then add the `runtime-attested` label and comment with ' +
                'the timestamp. See docs/contributing/pre-pr-checklist.md.'
              );
            } else {
              core.info('runtime-attested label present. Trust-but-post-a-timestamp-comment.');
            }

      - name: No-op when runtime paths untouched
        if: steps.filter.outputs.runtime != 'true'
        run: echo "No runtime-touching paths in this PR; attestation not required."

  doc-staleness-reminder:
    name: doc staleness reminder (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect code-vs-docs drift
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'crates/**'
              - 'scripts/**'
              - 'templates/**'
              - 'images/**'
              - 'justfile'
              - '.github/workflows/**'
            docs:
              - 'README.md'
              - 'docs/**'
              - 'AGENTS.md'
              - '.claude/skills/**'

      - name: Post sticky comment if drift detected
        if: steps.filter.outputs.code == 'true' && steps.filter.outputs.docs != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: doc-staleness-reminder
          message: |
            ### Documentation reminder (advisory)

            This PR changes code but does not update any docs. That is often fine, but the pre-PR checklist asks you to confirm it was deliberate.

            Touched code paths may map to:
            - `README.md` — install, CLI surface, platforms, benchmark table
            - `docs/explainer.md` — conceptual model
            - `docs/decisions/` — ADRs
            - `docs/future-work.md` — closed roadmap items
            - `AGENTS.md` + `.claude/skills/**` — **required** if you changed `justfile`, `.github/workflows/**`, or `scripts/release.sh`

            See [`docs/contributing/pre-pr-checklist.md`](../blob/main/docs/contributing/pre-pr-checklist.md#documentation-updates). This reminder is advisory and does not block merge.

      - name: Clear sticky comment if drift resolved
        if: steps.filter.outputs.code != 'true' || steps.filter.outputs.docs == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: doc-staleness-reminder
          delete: true
