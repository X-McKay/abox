# abox configuration
#
# Run 'abox init' to generate this file automatically.
#
# To configure manually: copy this file to ~/.abox/config.toml and
# uncomment / edit the values you want to change.

# Base directory for abox state (worktrees, logs, trust records).
# state_dir = "~/.abox"

# Directory for runtime files (sockets, PIDs).
#
# IMPORTANT — keep this path short. Unix domain socket paths are capped at
# 104 bytes (macOS; 108 on Linux), and abox appends per-sandbox suffixes
# like "msb-<task-id>.sock_5000". The default (~/.abox/r) is chosen to stay
# well within the limit. If you customise this, verify the worst-case
# length with 'abox doctor'.
#
# Defaults to ~/.abox/r (no need to set this unless you want a different location).
# runtime_dir = "~/.abox/r"

# ─── Guest OCI Images ──────────────────────────────────────────────────────
#
# Environment profiles (base, node, python, python-glibc, rust) resolve to
# pinned OCI images through the manifest embedded in each abox release —
# users never manage image URLs directly. Images are pulled on first use.
#
# Development escape hatch: override the image for a profile. Host-owned
# config only; a local absolute path is used verbatim as a rootfs.
#
# [images.overrides]
# node = "localhost:5000/dev-guest:latest"

[sandbox_defaults]
# Memory allocation per sandbox in MiB.
memory_mib = 2048

# Number of vCPUs per sandbox.
vcpus = 2

[proxy]
# Port for the HTTP egress proxy.
egress_port = 18443

# Directory containing policy TOML files.
# policy_dir = "~/.abox/policies"

# ─── Managed Authentication ────────────────────────────────────────────────
#
# abox's default supported auth surface is:
#   - Claude Code
#   - Codex
#
# Enabling a managed provider causes abox to stage a worthless stub file into
# the guest and inject the real host-side credential at request time. Real
# secrets never enter the sandbox.
#
# Uncomment the providers you want abox to manage. The default host path can be
# overridden if your credential file lives somewhere else.
#
# [auth.providers.claude]
# enabled = true
# # host_credential_file = "~/.claude/.credentials.json"
#
# [auth.providers.codex]
# enabled = true
# # host_credential_file = "~/.codex/auth.json"
#
# ─── Advanced Custom Stubs ─────────────────────────────────────────────────
#
# This is an explicitly advanced escape hatch for unsupported tools. It is
# stub-only: abox never copies the real host credential into the sandbox.
#
# If you use it, you must also add the matching host-side policy / egress rule
# yourself. See docs/credential-scoping.md for directions.
#
# [auth.advanced]
# [[auth.advanced.stub_files]]
# host_credential_file = "~/.tool/auth.json"
# guest = "~/.tool/auth.json"
# mode = "0600"
#
# [auth.advanced.stub_files.stub]
# access_token = "abox-proxy-managed"

# ─── Repo-owned environment (project.toml, not config.toml) ───────────────────
#
# Guest profile selection lives in .abox/project.toml for each repo, not here.
# This block is shown for reference only.
#
# [environment]
# profile = "python"          # default Python profile (Alpine/musl)
# profile = "python-glibc"   # Python on glibc; pip/uv get manylinux wheels (larger image)
# profile = "node"
# profile = "rust"
