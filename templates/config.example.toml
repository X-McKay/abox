# abox configuration
#
# Run 'abox init' to generate this file automatically with all paths
# pre-filled based on your bootstrap output.
#
# To configure manually: copy this file to ~/.abox/config.toml and
# uncomment / edit the values you want to change.

# Base directory for abox state (worktrees, snapshots, logs).
# state_dir = "~/.abox"

# Directory for runtime files (sockets, PIDs).
#
# IMPORTANT — keep this path short. Linux caps Unix domain socket paths at
# 108 bytes, and abox appends per-sandbox suffixes like
# "vfs-status-<task-id>.sock". The default (~/.abox/r) is chosen to stay
# well within the limit. If you customise this, verify the worst-case
# length with 'abox doctor'.
#
# Defaults to ~/.abox/r (no need to set this unless you want a different location).
# runtime_dir = "~/.abox/r"

[vm_defaults]
# Memory allocation per sandbox in MiB.
memory_mib = 2048

# Number of vCPUs per sandbox.
vcpus = 2

# Path to the guest root filesystem image.
# After running 'abox init' or 'just bootstrap-vm', this will be at:
#   ~/.abox/vm/rootfs.raw
# image_path = "~/.abox/vm/rootfs.raw"

# Path to the kernel binary (vmlinux, not bzImage).
# After running 'abox init' or 'just bootstrap-vm', this will be at:
#   ~/.abox/vm/vmlinux
# kernel_path = "~/.abox/vm/vmlinux"

[proxy]
# Port for the HTTP egress proxy.
egress_port = 18443

# Directory containing policy TOML files.
# policy_dir = "~/.abox/policies"

# ─── Guest credential forwarding ────────────────────────────────────────────
#
# Credential files to stage inside the guest VM at boot.
#
# For each entry you can either COPY the host file into the guest (`stub`
# omitted) or PLACE A STUB (`stub` set) — the stub is a placeholder file that
# passes the tool's local auth check, while the real credential is injected
# by the egress proxy at the network layer (see `policies/default.toml`).
# Stubs are the preferred mode: the VM never sees the real credential.
#
# The examples below forward Claude Code and Codex OAuth credentials.
# Uncomment and adjust for your setup. See docs/explainer.md Section 8.
#
# [guest]
#
# # ── Claude Code ──
# [[guest.credential_files]]
# host = "~/.claude/.credentials.json"
# guest = "~/.claude/.credentials.json"
# mode = "0600"
#
# [guest.credential_files.stub]
# [guest.credential_files.stub.claudeAiOauth]
# accessToken = "abox-proxy-managed"
# refreshToken = "abox-proxy-managed"
# expiresAt = 9999999999999
# scopes = ["user:inference"]
# subscriptionType = "pro"
#
# # ── Codex (OpenAI) ──
# [[guest.credential_files]]
# host = "~/.codex/auth.json"
# guest = "~/.codex/auth.json"
# mode = "0600"
#
# [guest.credential_files.stub]
# auth_mode = "chatgpt"
#
# [guest.credential_files.stub.tokens]
# id_token = "abox-proxy-managed"
# access_token = "abox-proxy-managed"
# refresh_token = "abox-proxy-managed"
# account_id = "abox-proxy-managed"
# last_refresh = "2099-01-01T00:00:00Z"
